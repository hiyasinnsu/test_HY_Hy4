<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050711">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="スマートフォンのブラウザで遊べる縦画面の弾幕シューティング。">
  <title>星屑弾幕 | HOSHIKUZU DANMAKU</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGRlZnM+PHJhZGlhbEdyYWRpZW50IGlkPSJnIiBjeD0iNDAlIiBjeT0iMzUlIiByPSI3MCUiPjxzdG9wIG9mZnNldD0iMCIgc3RvcC1jb2xvcj0iI2VhZmZmZiIvPjxzdG9wIG9mZnNldD0iLjQ1IiBzdG9wLWNvbG9yPSIjN2RmN2ZmIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjZmY2ZmM0Ii8+PC9yYWRpYWxHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwNzBhMTgiLz48Y2lyY2xlIGN4PSIzMiIgY3k9IjMyIiByPSIxNiIgZmlsbD0idXJsKCNnKSIvPjxjaXJjbGUgY3g9IjMyIiBjeT0iMzIiIHI9IjQiIGZpbGw9IiNmZmZmZmYiLz48cGF0aCBkPSJNMzIgNGw0IDExLTQgNC00LTR6IiBmaWxsPSIjYjc5Y2ZmIi8+PC9zdmc+">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" width="360" height="640" role="img" aria-label="弾幕シューティングのプレイフィールド">星屑弾幕のプレイフィールド。ドラッグで移動し、ショットは自動で発射されます。</canvas>

      <div id="hud" aria-hidden="true">
        <div class="hud-top">
          <div class="hud-block">
            <span class="hud-label">SCORE</span>
            <span id="hud-score" class="hud-score">0000000</span>
          </div>
          <div class="hud-block align-right">
            <span class="hud-label">HI-SCORE</span>
            <span id="hud-hi" class="hud-score hi">0000000</span>
          </div>
        </div>
        <div class="hud-stats">
          <span class="stat"><span class="hud-label">残機</span><b id="hud-lives">3</b></span>
          <span class="stat"><span class="hud-label">ボム</span><b id="hud-bombs">3</b></span>
          <span class="stat power">
            <span class="hud-label">POWER</span>
            <span class="power-track"><i id="hud-power-fill"></i></span>
          </span>
          <span class="stat"><span class="hud-label">かすり</span><b id="hud-graze">0</b></span>
          <span class="stat combo" id="hud-combo-wrap" hidden><span class="hud-label">COMBO</span><b id="hud-combo">0</b></span>
          <span class="stat wave" id="hud-wave">WAVE 1/9</span>
        </div>
        <div id="boss-bar" class="boss-bar" hidden>
          <div class="boss-meta">
            <span id="boss-name">星喰みのオボロ</span>
            <span id="boss-phase">PHASE 1/3</span>
          </div>
          <div class="boss-track"><i id="boss-fill"></i></div>
          <div id="boss-label" class="boss-label"></div>
        </div>
      </div>

      <div id="controls" class="controls" aria-label="操作ボタン">
        <button id="btn-pause" class="ctrl-btn pause" type="button" aria-label="ポーズ">ポーズ</button>
        <div class="control-cluster">
          <div class="control-stack">
            <button id="btn-sound" class="ctrl-btn tiny" type="button" aria-label="音をオンにする" aria-pressed="false">音 OFF</button>
            <button id="btn-fullscreen" class="ctrl-btn tiny" type="button" aria-label="全画面表示">全画面</button>
          </div>
          <button id="btn-bomb" class="ctrl-btn bomb" type="button" aria-label="ボム">ボム</button>
        </div>
      </div>

      <div id="overlay" class="overlay" aria-live="polite">
        <div class="panel">
          <p id="overlay-kicker" class="kicker">VERTICAL DANMAKU</p>
          <h1 id="overlay-title">星屑弾幕</h1>
          <p id="overlay-body" class="body">指でドラッグして避け、自動射撃で敵を撃ち抜け。<br>5種類のボス弾幕をかわして、星喰みを討て。</p>
          <p id="overlay-stats" class="stats">HI-SCORE  0000000</p>
          <div class="actions">
            <button id="btn-primary" class="btn-primary" type="button">ゲーム開始</button>
            <button id="btn-secondary" class="btn-ghost" type="button" hidden>タイトルへ</button>
            <button id="btn-title" class="btn-ghost" type="button" hidden>タイトルへ</button>
          </div>
          <p class="hint">タッチ: ドラッグで移動 / 自動射撃<br>キーボード: 矢印・WASD / Shift 集中 / Z・Space 射撃 / X ボム / Esc ポーズ</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
